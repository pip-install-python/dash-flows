<!DOCTYPE html>
<html lang="en">
<head>
    <!-- CHARSET MUST BE FIRST.
         The HTML spec requires the encoding declaration to appear entirely
         within the first 1024 bytes of the document. Dash emits its own
         charset meta in the placeholder block below, but that block comes
         *after* the per-page description/og/twitter tags register_page()
         prepends. Declaring it here pins it near byte 60 whatever Dash adds
         later; the duplicate is deliberate and harmless, the first
         declaration wins.

         NEVER NAME A DASH PLACEHOLDER INSIDE A COMMENT. Dash substitutes them
         by plain string replacement over the whole template, comments
         included — a placeholder spelled out in a comment emits its entire
         block twice, and a scraper reading the raw HTML sees two og:image
         tags and picks one. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Dash emits, per page, from register_page(): description, og:title,
         og:type, og:description, og:image and the full twitter:* set. Do NOT
         restate any of those below — a second, site-level copy is strictly
         worse than the page-level one, and search engines pick between
         duplicates arbitrarily. -->
    {%metas%}
    <title>{%title%}</title>
    <!-- The favicon placeholder below emits exactly ONE tag: a cache-busted
         <link rel="icon"> for the favicon.ico it finds anywhere under assets/
         (Dash walks the tree, so assets/favicon/favicon.ico is picked up).
         Do not add a second hand-written .ico link — that is a duplicate.
         Everything Dash does NOT emit is listed after it: the PNG size
         variants, the iOS touch icon and the manifest. The set is rendered by
         scripts/make_favicons.py. -->
    {%favicon%}
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">

    <!-- Two theme-colors, not one: the appshell follows
         prefers-color-scheme (components/appshell.py), so a single value
         would paint the mobile browser chrome wrong for half of visitors.
         These are the Mantine body backgrounds for each scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1b1e">

    {%css%}

    <!-- ========================================================================
         SITE-LEVEL TAGS DASH DOES NOT EMIT
         ========================================================================
         ONE RULE, and it is the whole reason this block is short: declare only
         what Dash does NOT emit itself.

         `dash.register_page()` makes Dash generate `description`, `og:type`,
         `og:title`, `og:description`, `og:image` and the full `twitter:*` set
         on EVERY request, per page (see `_page_meta_tags` in dash/_pages.py).
         Declaring them here as well produces two of each — and the static copy
         describes the SITE while Dash's describes the PAGE, so the duplicate
         is both redundant and less accurate.

         tests/test_social_card.py asserts the counts in both directions. -->
    <meta name="keywords" content="Plotly Dash, React Flow, xyflow, node graph, flow diagram, Dash Mantine Components, ELK layout, dash-flows, Python">
    <meta name="author" content="Pip Install Python LLC">
    <meta name="robots" content="index, follow">
    <meta property="og:site_name" content="dash-flows — React Flow node graphs for Dash">

    <!-- OG URL. Genuinely absent from Dash's per-page set, so it belongs here.
         The origin is substituted from lib/constants.py at startup; the
         client-side script below re-points it on SPA navigation. -->
    <meta property="og:url" content="__CANONICAL_ORIGIN__/">

    <!-- THE SOCIAL CARD — and note that the image URL itself is NOT here.
         Deliberately.

         Dash emits `og:image` and `twitter:image` for every page from
         `register_page(image_url=...)`, which `lib/constants.OG_IMAGE_URL`
         supplies (pages/home.py, pages/markdown.py). A static copy here would
         make TWO of each and let the scraper choose.

         What stays are the auxiliaries Dash never emits. Keep them in step
         with lib/constants.OG_IMAGE_* — a width/height that disagrees with
         the real file is worse than declaring none, because the platform
         reserves that box and crops into it. scripts/smoke_live.py reads the
         IHDR chunk of the actual CDN object after every deploy and compares.

         secure_url is the https duplicate Facebook still reads; type saves
         the scraper a HEAD request to learn the format. -->
    <meta property="og:image:secure_url" content="https://cdn.2plot.ai/github_assets/flows.2plot.dev.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="dash-flows — React Flow node graphs for Dash">

    <!-- Same rule as above: Dash emits twitter:card, twitter:url,
         twitter:title, twitter:description and twitter:image per page.

         BUT: Dash declares all five with `property=`, and Twitter reads
         `name=` — its parser predates the OG convention and never adopted
         it. So Dash's five are invisible to the one platform they exist
         for. The two tags below are the ones actually read: the card type
         declared with `name=`, and the alt text Dash omits entirely. The
         rest (title, description, image) falls back to the og:* set, which
         Twitter does read. Measured on this host 2026-08-22: the served
         document carried `property="twitter:card"` alone, so no page here
         declared a card type any scraper could see. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image:alt" content="dash-flows — React Flow node graphs for Dash">

    <!-- Keeps canonical / og:url / twitter:url correct across CLIENT-SIDE
         navigation only. dash-improve-my-llms emits all three server-side per
         route from its prerender block, so the raw document is already
         right — this exists solely because Dash routes without firing a
         navigation event, which leaves those tags describing the page the
         visitor first landed on.

         NEVER name that block's marker attribute in this file. The package
         decides whether it has already injected by testing whether the
         marker string appears anywhere in the served document — a substring
         probe, not a node lookup — so spelling it here (this comment used
         to) makes every response read as already-injected and silently
         disables the universal prerender site-wide. It did, in production,
         for as long as the words were here. Describe the block; do not
         quote it. tests/test_prerender.py pins both halves.

         UPDATE-ONLY, deliberately: it never creates a tag the server did not
         send. Creating one would put a second <link rel="canonical"> on the
         page whenever the package's prerender path did not run, and two
         canonicals is worse than a stale one — engines may ignore both.

         CANONICAL_ORIGIN is substituted from lib/constants.py at startup, not
         read from location.origin, so hits on the *.onrender.com hostname
         consolidate onto flows.2plot.dev instead of competing with it. -->
    <script>
    (function () {
        var CANONICAL_ORIGIN = '__CANONICAL_ORIGIN__';

        // Consumed by nothing today, kept for parity with older integrations
        // that read a global rather than closing over the origin.
        window.__DASH_FLOWS_BASE_URL__ = CANONICAL_ORIGIN;

        function update(selector, attr, value) {
            var el = document.head.querySelector(selector);
            if (el) { el.setAttribute(attr, value); }
        }

        function canonicalUrl() {
            var path = window.location.pathname || '/';
            // Collapse a trailing slash so /nodes and /nodes/ do not become
            // two indexed URLs. The root keeps its slash.
            if (path.length > 1 && path.charAt(path.length - 1) === '/') {
                path = path.slice(0, -1);
            }
            // Query strings and fragments are never part of the canonical.
            return CANONICAL_ORIGIN + path;
        }

        function sync() {
            var url = canonicalUrl();
            // Every one of these is emitted server-side; we only refresh them.
            update('link[rel="canonical"]', 'href', url);
            update('meta[property="og:url"]', 'content', url);
            update('meta[property="twitter:url"]', 'content', url);
        }

        // Dash routes client-side and fires no navigation event, so the only
        // reliable hook is patching the History API itself.
        ['pushState', 'replaceState'].forEach(function (name) {
            var original = history[name];
            history[name] = function () {
                var result = original.apply(this, arguments);
                sync();
                return result;
            };
        });
        window.addEventListener('popstate', sync);

        sync();
    })();
    </script>

    <!-- Structured data.
         SoftwareSourceCode, not SoftwareApplication: this describes an
         open-source library you import, not a hosted app you sign up for.
         Every value here is checked against the actual package — do not add
         ratings, prices or download counts that nothing measures. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "SoftwareSourceCode",
                "name": "dash-flows — React Flow node graphs for Dash",
                "description": "dash-flows — React Flow (@xyflow/react 12) node-graph components for Plotly Dash: interactive flow diagrams with a glass-morphism theme, ELK layouts, custom node/edge types and full Dash callback integration. By Pip Install Python.",
                "url": "__CANONICAL_ORIGIN__",
                "codeRepository": "https://github.com/pip-install-python/dash-flows",
                "programmingLanguage": ["Python", "JavaScript"],
                "version": "1.3.0",
                "runtimePlatform": "Python 3.9+, Dash 4.1+",
                "license": "https://opensource.org/licenses/MIT",
                "author": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://2plot.dev"
                }
            },
            {
                "@type": "WebSite",
                "name": "dash-flows — React Flow node graphs for Dash",
                "url": "__CANONICAL_ORIGIN__",
                "publisher": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://2plot.dev"
                }
            }
        ]
    }
    </script>

    <!-- LLM discovery. `llms-txt` only: the sitemap is already advertised
         where crawlers look for it — the Sitemap: line in /robots.txt, which
         scripts/smoke_live.py pins to this host — so a hand-rolled
         `llms-sitemap` meta was a second, unread declaration of the same URL
         that could drift from the first. -->
    <meta name="llms-txt" content="__CANONICAL_ORIGIN__/llms.txt">

</head>
<body>
    {%app_entry%}
    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>
</body>
</html>
