<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>dash-flows — React Flow components for Plotly Dash</title>
    <meta name="title" content="dash-flows — React Flow components for Plotly Dash">
    <meta name="description" content="dash-flows wraps @xyflow/react (React Flow 12) for Plotly Dash: interactive node graphs with a glass-morphism theme, ELK layouts, custom node/edge types, and full Dash callback integration.">
    <meta name="keywords" content="Plotly Dash, React Flow, xyflow, node graph, flow diagram, Dash Mantine Components, ELK layout, dash-flows, Python">
    <meta name="author" content="Pip Install Python">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="dash-flows — React Flow components for Plotly Dash">
    <meta property="og:description" content="Interactive node graphs for Plotly Dash, powered by React Flow 12.">
    <meta property="og:site_name" content="dash-flows">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="dash-flows — React Flow components for Plotly Dash">
    <meta property="twitter:description" content="Interactive node graphs for Plotly Dash, powered by React Flow 12.">

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <meta name="theme-color" content="#3b82f6">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Dash-required template tags -->
    {%metas%}
    {%favicon%}
    {%css%}

    <noscript>
        <div style="padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; line-height: 1.6;">
            <h1>dash-flows</h1>
            <p><strong>This documentation site requires JavaScript.</strong></p>
            <p>dash-flows provides React Flow (@xyflow/react) node-graph components for Plotly Dash.
               See the source and examples at
               <a href="https://github.com/pip-install-python/dash-flows">github.com/pip-install-python/dash-flows</a>.</p>
        </div>
    </noscript>
</head>
<body>
    {%app_entry%}
    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>
</body>
</html>
