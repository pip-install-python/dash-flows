name: CI

# Two things at once, because this repo is two things: a published component
# library AND the docs site at flows.2plot.dev.
#
#   library   the example smoke matrix across the supported Dash range, the
#             wheel build, and a clean-venv install proving the dash>=4.1
#             floor;
#   satellite the 2plot network baseline — a secretless pytest run, the real
#             Docker image booted and probed by the same battery that runs
#             against production, and version fingerprints asserted INSIDE the
#             artifact (pip metadata is invisible from outside a running host).
#
# Deliberately NOT `push: branches: [main]`. cd.yml runs on that push and its
# first job `uses:` this workflow, so a push to main would start two runs of it
# — which then contend for the `ci-${{ github.ref }}` concurrency group below
# and cancel each other. So: pull requests get their own CI, and `main` is
# owned by CD. There is no coverage gap — CD cannot deploy without this
# workflow passing first.
on:
  pull_request:
  workflow_dispatch:
  # Called by cd.yml so a deploy can never ship something the matrix rejected.
  workflow_call:

# Read-only. Nothing here publishes, comments or tags; the deploy lives in
# cd.yml behind a `production` environment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Never let a CI run inherit production behaviour: `require_owned_base_url()`
  # keys off RENDER / APP_ENV, and the satellite reporter keys off the webhook
  # secret. Both must stay inert here.
  APP_ENV: ci

# TWO different Python floors, and conflating them is the easy mistake:
#
#   * the PACKAGE follows dash>=4.1's own floor — verified by the package
#     jobs, which install the wheel with nothing but Dash;
#   * the DOCS SITE needs >= 3.10 — `python-frontmatter` imports
#     `typing.TypeGuard`, which is 3.10+. It does not constrain the package.
#
# The MATRIX no longer proves that 3.10 claim. Since 1.6.27 the fleet runs
# ONE Python (3.14, the Dockerfile's FROM tag) and the compat window stays
# three minors wide around it — 3.14/3.13/3.12 here. The >= 3.10 line above
# stays as the documented floor for a developer running the docs site
# locally; the deployed artifact is the image, and the image is 3.14.
# tests/test_python_version.py holds the window and every encoding.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install flake8
      - name: flake8
        run: flake8 lib components pages tests scripts run.py

      # The workflows lint themselves. This is not belt-and-braces: an invalid
      # workflow file is the one defect CI structurally cannot report, because
      # the run dies before a job exists to fail. A double-quoted string inside
      # a ${{ }} expression is a LEX error that invalidates the whole file —
      # it silently killed every CI and CD run on boilerplate.2plot.dev for
      # four days, with nothing to click and nothing in the API but
      # `conclusion: failure` and zero jobs. actionlint catches it in a second.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  docs-tests:
    name: Docs site · pytest (zero secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the docs site
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          # markdown2dash pins gunicorn<22 against the CVE-driven gunicorn>=23
          # floor. Same two-command install as the Dockerfile.
          pip install --no-deps markdown2dash==0.1.2
          pip install -e .
          pip install pytest

      - name: Confirm the pinned dependency versions
        run: |
          python - <<'PY'
          import dash, dash_improve_my_llms as pkg, gunicorn
          import dash_mantine_components as dmc
          from importlib.metadata import version as _v

          def parts(v):
              return tuple(int(x) for x in v.split(".")[:3] if x.isdigit())

          assert parts(dash.__version__)[:2] >= (4, 1), dash.__version__
          # 2.7.1 is the network floor. Below 2.3.4 `resolve_site_title` does
          # not exist and this site's identity degrades to app.title; below
          # 2.6.0 there is no `configure_access` for the gate to read; below
          # 2.6.1 the prerender block ships `hidden` and every
          # visibility-respecting reader sees "Loading..." and nothing else;
          # below 2.7.0 every page serves a duplicate H1 to crawlers and the
          # idempotency probe still trips on a page that merely mentions the
          # marker; below 2.7.1 there are no llms.txt v2 discovery relations,
          # no text/plain Accept ramp and no representation digest.
          assert parts(pkg.__version__) >= (2, 7, 1), pkg.__version__
          # 2.7.0 renders the network-standard mobile drawer as a floating
          # card from identical props. 2.8.0 is the floor for the drawer.
          assert parts(dmc.__version__) >= (2, 8, 0), dmc.__version__
          # 21.x carried two request-smuggling CVEs (CVE-2024-6827,
          # CVE-2024-1135). markdown2dash's spurious <22 pin must not win.
          assert parts(gunicorn.__version__)[:2] >= (23, 0), gunicorn.__version__
          # The Clerk security baseline: SDK 5.x capped cryptography below
          # the fixes for four advisories, so both floors move together.
          assert parts(_v("clerk-backend-api"))[0] == 7, _v("clerk-backend-api")
          assert parts(_v("cryptography"))[0] >= 50, _v("cryptography")
          import dash_clerk_auth  # noqa: F401 — vendored, must be importable
          assert parts(_v("dash-clerk-auth")) >= (1, 0, 5), _v("dash-clerk-auth")
          print(f"dash {dash.__version__}, dash-improve-my-llms "
                f"{pkg.__version__}, dmc {dmc.__version__}, "
                f"gunicorn {gunicorn.__version__}, "
                f"dash-clerk-auth {_v('dash-clerk-auth')}")
          PY

      # No CROSS_APP_WEBHOOK_SECRET, no NETWORK_BULLETIN_URL here ON PURPOSE.
      # tests/conftest.py pins them empty, and the app's degraded postures
      # (a dormant reporter, an unwired bulletin) are only provable when
      # nothing is configured.
      - name: Test suite (zero secrets)
        run: pytest tests -q --ignore=tests/test_examples_render.py

      - name: Docs render + example import gates
        run: |
          python scripts/validate_docs.py
          python scripts/smoke_examples.py

      - name: Boot under a production server
        run: |
          gunicorn run:server -b 127.0.0.1:8560 --daemon --access-logfile - --error-logfile -
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8560/healthz && break
            sleep 1
          done
          # A page that renders under the test client can still fail under a
          # real WSGI worker — different import path, different working
          # directory, no test-client conveniences.
          curl -sf http://127.0.0.1:8560/ > /dev/null
          curl -sf http://127.0.0.1:8560/getting-started > /dev/null
          # The battery, against the same server this satellite deploys.
          python3 scripts/network_smoke.py --base-url http://127.0.0.1:8560

  docker:
    name: docker image · boot · battery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [docs-tests]
    steps:
      - uses: actions/checkout@v4

      # The same build Render runs. This is where a dependency-resolution
      # failure surfaces — at CI time, not deploy time, where the only signal
      # is a dashboard log while the old image keeps serving.
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: dash-flows-docs:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # pip metadata is invisible from outside a running host, so the versions
      # are asserted here, inside the artifact that actually ships.
      - name: Version fingerprints inside the image
        run: |
          docker run --rm dash-flows-docs:ci python -c "
          from importlib.metadata import version

          def parts(v):
              return tuple(int(x) for x in v.split('.')[:3] if x.isdigit())

          v = version('dash')
          print('dash', v)
          assert parts(v)[:2] >= (4, 1), f'expected dash >=4.1, image has {v}'

          v = version('dash-improve-my-llms')
          print('dash-improve-my-llms', v)
          assert parts(v) >= (2, 7, 1), f'expected >=2.7.1 (llms.txt v2 relations), image has {v}'

          v = version('dash-mantine-components')
          print('dash-mantine-components', v)
          assert parts(v) >= (2, 8, 0), f'expected dmc>=2.8 (network drawer), image has {v}'

          # The vendored Clerk hook. A vendor/ path that resolved to an empty
          # directory installs NOTHING and pip says so in a soft warning
          # seconds before an unrelated-looking OSError — so the only honest
          # check is importing the package inside the artifact that ships.
          import dash_clerk_auth  # noqa: F401
          v = version('dash-clerk-auth')
          print('dash-clerk-auth', v)
          assert parts(v) >= (1, 0, 5), f'expected dash-clerk-auth>=1.0.5, image has {v}'

          v = version('clerk-backend-api')
          print('clerk-backend-api', v)
          assert parts(v)[0] == 7, f'expected clerk-backend-api 7.x, image has {v}'

          v = version('cryptography')
          print('cryptography', v)
          assert parts(v)[0] >= 50, f'expected cryptography>=50, image has {v}'

          # markdown2dash installs with --no-deps to dodge its gunicorn<22
          # pin; this assert is what proves the dodge kept working. 21.x
          # carried two request-smuggling CVEs (CVE-2024-6827, CVE-2024-1135).
          v = version('gunicorn')
          print('gunicorn', v)
          assert parts(v)[:2] >= (23, 0), f'expected gunicorn>=23, image has {v}'

          # ...and that skipping its dependency graph did not skip the package.
          import markdown2dash  # noqa: F401
          print('markdown2dash importable')
          "

      # Boot with no secrets: the traffic reporter stays dormant, the bulletin
      # stays unwired. What this catches is any import-time or preload crash —
      # the class of failure where the platform loops the worker and the
      # deploy never goes live.
      - name: Boot the container and wait for /healthz
        run: |
          docker run -d --name docs -p 8560:8560 dash-flows-docs:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8560/healthz > /dev/null; then
              echo "healthy after ~$((i*2))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' docs)" != "true" ]; then
              echo "container exited during boot:"
              docker logs docs
              exit 1
            fi
            sleep 2
          done
          echo "never became healthy; last logs:"
          docker logs --tail 100 docs
          exit 1

      # The curl above proves the APP answers. It says nothing about whether
      # the HEALTHCHECK instruction works — a broken probe ships silently and
      # everything stays green while the orchestrator sees an opaque box
      # (emojimart's template-class finding, 1.6.19). Poll Docker's own
      # verdict: with --interval=30s and --start-period=20s the first probe
      # lands within ~50s. `none` FAILS — no HEALTHCHECK means the container
      # cannot report its own health to anything that schedules it.
      - name: Assert Docker's own health verdict
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' docs 2>/dev/null || echo none)"
            if [ "$status" = "healthy" ]; then
              echo "docker reports healthy after ~$((i*3))s"
              exit 0
            fi
            if [ "$status" = "none" ]; then
              echo "image has NO HEALTHCHECK — the container is opaque to its orchestrator"
              exit 1
            fi
            sleep 3
          done
          echo "HEALTHCHECK never reported healthy (last: $status) — the probe itself is broken:"
          docker inspect -f '{{json .State.Health}}' docs || true
          exit 1

      # The SAME script CD runs against https://flows.2plot.dev, so a failure
      # in CI and a failure in production read identically.
      - name: Smoke battery against the booted container
        run: python3 scripts/network_smoke.py --base-url http://127.0.0.1:8560

      - name: Container logs (for the record)
        if: always()
        run: docker logs --tail 40 docs 2>/dev/null || true

  examples:
    name: Examples · Dash ${{ matrix.dash }} · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The docs-site floor and the current release. The package's own 4.1.0
        # floor is proven separately by the `package` job in a clean venv —
        # the examples pull in dmc and the docs stack, which have their own,
        # higher floors.
        #
        # `python` main is the fleet Python (the Dockerfile's FROM minor);
        # the include legs are the two minors below it, so the examples keep
        # a three-wide compat window without a second declared Python.
        dash: ["4.2.0", "4.4.1"]
        python: ["3.14"]
        include:
          - dash: "4.4.1"
            python: "3.12"
          - dash: "4.4.1"
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Dash ${{ matrix.dash }} first
        # Install the version under test BEFORE the rest, so the other
        # requirements resolve against it rather than dragging in a newer Dash.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dash[dev]==${{ matrix.dash }}"

      - name: Install the docs/example requirements
        run: |
          # The dash line is stripped so it cannot override the matrix version.
          grep -v '^dash\[dev\]' requirements-docs.txt > /tmp/reqs.txt
          python -m pip install -r /tmp/reqs.txt
          python -m pip install --no-deps markdown2dash==0.1.2
          python -m pip install -e .

      - name: Report the resolved Dash version
        # A silent upgrade here would make the whole matrix meaningless.
        run: |
          RESOLVED=$(python -c "import dash; print(dash.__version__)")
          echo "requested=${{ matrix.dash }} resolved=$RESOLVED"
          if [ "$RESOLVED" != "${{ matrix.dash }}" ]; then
            echo "::warning::Dash resolved to $RESOLVED, not ${{ matrix.dash }}"
          fi

      - name: Import gate — every example imports clean
        run: python scripts/smoke_examples.py

      - name: Runtime gate — every example serves /, layout and dependencies
        run: python scripts/smoke_runtime.py

  package:
    name: Build + verify the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Version consistency
        # package.json, lib/constants.py and the generated package-info must
        # agree before a wheel carrying one of them ships.
        run: |
          python - <<'PY'
          import json, re, pathlib

          pkg = json.load(open("package.json"))["version"]
          info = json.load(open("dash_flows/package-info.json"))["version"]
          constants = pathlib.Path("lib/constants.py").read_text()
          app = re.search(r'APP_VERSION = "([^"]+)"', constants).group(1)
          print(f"package.json={pkg} package-info={info} constants={app}")
          assert pkg == info == app, "version drift — fix before releasing"
          PY

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean venv at the dash floor
        # The package must work with ONLY `dash` present — nothing from
        # requirements-docs.txt, which is the docs site's dependency set —
        # and at dash 4.1.0, the floor setup.py claims.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install "dash==4.1.0"
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import pathlib

          import dash
          import dash_flows as df

          bundle = pathlib.Path(df.__file__).parent / "dash_flows.min.js"
          assert bundle.exists(), "JS bundle missing from the wheel"
          print("bundle:", bundle.stat().st_size // 1024, "KB")

          # The registry CLAUDE.md documents; a missing name means the wheel
          # shipped without a component the docs advertise.
          expected = [
              "DashFlows", "DefaultNode", "InputNode", "OutputNode",
              "GroupNode", "ResizableNode", "AnimatedCircleNode",
              "ToolbarNode", "ButtonEdge", "DataEdge", "AnimatedSvgEdge",
              "AnimatedNodeEdge",
          ]
          for name in expected:
              assert hasattr(df, name), f"missing component: {name}"
          print(f"components OK ({len(expected)} spot-checked)")

          # The wheel must carry the library and nothing else. `lib`, `pages`,
          # `components` and `docs` are docs-site directories that a careless
          # find_packages() would happily install as top-level packages.
          from importlib.metadata import distribution

          top = (distribution("dash_flows").read_text("top_level.txt") or "").split()
          assert top == ["dash_flows"], f"wheel installs more than the library: {top}"
          print("top_level.txt:", top, "· dash", dash.__version__)
          PY

      - name: Render a layout with the installed wheel
        run: |
          /tmp/clean/bin/python - <<'PY'
          import dash_flows as df
          from dash import Dash
          from dash._utils import to_json

          app = Dash(__name__)
          app.layout = df.DashFlows(
              id="flow",
              nodes=[
                  {"id": "a", "type": "input", "position": {"x": 0, "y": 0},
                   "data": {"label": "A"}},
                  {"id": "b", "type": "output", "position": {"x": 200, "y": 0},
                   "data": {"label": "B"}},
              ],
              edges=[{"id": "ab", "source": "a", "target": "b"}],
              style={"height": "400px"},
          )
          to_json(app.layout)
          print("layout serialises OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

  lint-js:
    name: JS bundle parses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The committed bundle is what users actually load, and it is a build
      # artifact nobody reviews line by line. Parsing it here is the cheapest
      # guard against committing a truncated or half-written build.
      - name: Parse the committed component bundle
        run: node --check dash_flows/dash_flows.min.js
      - name: Parse assets/*.js individually
        run: for f in assets/*.js; do node --check "$f"; done

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory on purpose. A CVE in a transitive dependency of a docs site is
    # worth knowing about the day it lands, and worth nobody's broken build at
    # 2am. The report is the value; flip this off once the baseline is quiet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-docs.txt --skip-editable
