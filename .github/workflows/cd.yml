name: CD

# Deploys flows.2plot.dev, then checks the live site.
#
# The deploy step POSTs to a Render deploy hook held in the
# RENDER_DEPLOY_HOOK_URL secret. Without that secret the step is skipped and
# the workflow goes straight to verification — which is the right behaviour
# here, because render.yaml sets `autoDeploy: true` and Render is already
# deploying from GitHub on its own. The hook only makes the timing explicit so
# the wait loop below knows what it is waiting for.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://flows.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the wait loop below (up to 100 × 15s = 25 minutes) and
    # no longer. Without it the job inherits GitHub's six-hour default, which
    # is how a platform that never comes back healthy holds the
    # `cd-production` concurrency group all day.
    #
    # SIZED FOR THE WORST BUILD, not the median: the round's most important
    # deploy is always the one that busts the pip cache (a floor bump), and
    # that is the slowest image this repo ever builds — dash-email timed out
    # on exactly that class (1.6.13).
    timeout-minutes: 30
    environment:
      name: production
      url: https://flows.2plot.dev
    outputs:
      deployed: ${{ steps.hook.outputs.deployed }}
    steps:
      - name: Trigger the Render deploy hook
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            # ::warning, not ::notice — dash-email's finding (2026-08-23):
            # a notice is invisible in the run summary, so a repo whose hook
            # secret was never set looked identical to one that deployed.
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set — this push deploys only if render.yaml autoDeploy fires. The build-match wait below still holds for THIS commit either way."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for THIS build to serve traffic
        # NOT gated on the hook step, and that is the whole fix: with
        # RENDER_DEPLOY_HOOK_URL unset — which is the recorded fleet
        # decision, Render's autoDeploy owns deploy timing — the old shape
        # SKIPPED this wait entirely and let `verify` run the battery
        # seconds after the push, against the PREVIOUS release. The defect
        # was invisible for the workflow's whole life, because the old build
        # always already passed the old battery; it only shows when a run
        # adds a new surface. Found on muicharts 2026-08-21, fleet-wide
        # class, and this repo had it verbatim.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bare 200 proves nothing about WHICH build answered: /healthz
          # now reports the running instance's commit (RENDER_GIT_COMMIT),
          # and this loop holds until it equals the SHA that triggered this
          # run. Fallback: a build that predates the field gets the old
          # sustained-health wait, with a warning naming what it cannot tell
          # — that fallback fires exactly once, on the deploy that carries
          # the field for the first time.
          #
          # Fail FAST on supersession (1.6.25; observed live on 4a1d430,
          # 2026-08-25): when a DIFFERENT build serves, one compare-API
          # call per distinct sha classifies it. "ahead" — the live build
          # is a DESCENDANT of this run's sha — means branch HEAD moved
          # past us and the hook shipped it; this run's build can never
          # serve again, so holding the remaining ~25 minutes only turns
          # a race into a timeout. That commit's own run must certify it.
          # Every other verdict keeps waiting: "behind" is the previous
          # release still serving mid-build (the normal case) or a
          # deliberate rollback — an older build is NOT a descendant and
          # must not fast-fail; "diverged" and unknown/404 prove nothing,
          # so the honest generic timeout stays their answer.
          want="${GITHUB_SHA}"
          matched=0
          ok=0
          checked=""
          for _ in $(seq 1 100); do
            body="$(curl -fsS "$SITE_URL/healthz" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              build="$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
              if [ "$build" = "$want" ]; then
                matched=$((matched + 1))
                [ "$matched" -ge 3 ] && break
              elif [ -z "$build" ]; then
                ok=$((ok + 1))
              elif [ "$build" != "$checked" ]; then
                checked="$build"
                rel="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${want}...${build}" --jq .status 2>/dev/null || true)"
                if [ "$rel" = "ahead" ]; then
                  echo "::error::superseded — $build already serves and is a descendant of $want; that commit's own run must certify"
                  exit 1
                fi
                echo "::notice::live build $build is ${rel:-unknown} relative to $want — still waiting for this run's build"
              fi
            fi
            sleep 15
          done
          if [ "$matched" -ge 3 ]; then
            echo "::notice::live /healthz reports build $want — verifying the artifact this run shipped."
          elif [ "$ok" -ge 5 ]; then
            echo "::warning::live /healthz predates the build field — cannot prove WHICH build is serving; verified sustained health only. This warning should appear exactly once."
          else
            echo "::error::$SITE_URL never served this run's build ($want) and never became reliably healthy"
            exit 1
          fi

  verify:
    name: verify the live site
    needs: [deploy]
    # != 'skipped' too (muicharts' fix, adopted 2026-08-24): when deploy is
    # skipped there is nothing this run shipped to verify — running anyway
    # certifies whatever build happens to be serving and turns one cause
    # into two red jobs.
    if: always() && needs.deploy.result != 'cancelled' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The network battery first: it is the same script, with the same check
      # names, that CI ran against the container this deploy shipped. A name
      # that passed in CI and fails here isolates the fault to the deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the social card's real pixels, and
      # every peer llms.txt in the directory actually resolving. Peer checks
      # WARN; own-host checks FAIL — a hub outage must never block this
      # satellite's deploy, and this satellite's regressions always must.
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a blank or reshaped social card, a missing network directory, and dead peer llms.txt links."
