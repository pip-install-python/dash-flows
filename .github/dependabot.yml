# Version drift is the network's chronic disease — satellites were still
# running a 2.0-era artifact the day 2.3.4 shipped, and nothing about a stale
# host looks broken from the outside. This is the standing fix.
#
# TEMPLATE FILE: satellites copy this verbatim. The `dash-network` group is
# the point — a package release lands as ONE reviewable pull request per repo
# instead of five, which is the difference between a rollout and a chore.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Version-update PRs are restricted to the network packages — the drift
    # alarm this file exists for. Without this allow-list, dependabot also
    # proposes FLOOR-RAISES for every other requirement (gunicorn >=23 →
    # >=26, cryptography >=50 → >=51, ...). Those floors encode
    # minimum-compatibility knowledge — the gunicorn floor IS the
    # CVE-2024-6827/CVE-2024-1135 fact, the cryptography floor IS the Clerk
    # SDK 5.x advisory fact — the resolver already installs the latest
    # release under them, and raising one erases its meaning while adding
    # nothing. This fork opened six such PRs on its first push after the
    # gate wave (mistune, python-frontmatter, requests, dash, gunicorn,
    # dash-improve-my-llms, 2026-08-22). SECURITY updates are unaffected:
    # they arrive through GitHub's separate security-update channel
    # regardless of this list.
    allow:
      - dependency-name: "dash*"
      - dependency-name: "plotly*"
      - dependency-name: "markdown2dash"
    groups:
      dash-network:
        patterns:
          - "dash*"
          - "plotly*"
          - "markdown2dash"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
