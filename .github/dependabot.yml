# TEMPLATE FILE: satellites copy this verbatim.
#
# Version updates for pip are OFF BY DESIGN (2026-08-25). On range
# requirements dependabot can only propose FLOOR RAISES, so the old
# `dash-network` allow-list group structurally produced the exact PR class
# the allow-list existed to suppress — 18 of the fleet's 38 open dependabot
# PRs were pip floor-raises. Floors encode minimum-compatibility knowledge
# (a gunicorn floor IS the CVE fact), the resolver already installs latest
# under them, and a raise erases the floor's meaning while adding none.
# Floors move deliberately, through sync specs, every encoding at once;
# drift detection — the group's stated purpose — is already answered on the
# wire by the contract battery (healthz `dash_version` against the floor).
#
# SECURITY updates are unaffected. They ride GitHub's security-update
# channel — dependency graph + Dependabot alerts, enabled per repo in
# Settings → Advanced Security — which needs no entry in this file:
# "There is no interaction between the settings specified in the
# dependabot.yml file and Dependabot security alerts" (GitHub docs,
# code-security/concepts/supply-chain-security/dependabot-security-updates).
version: 2
updates:
  # Runner/action bumps are mechanical and CI-gated; a human merges the
  # group's PR when its CI is green — never a bot actor on main. (The
  # 1.6.24 auto-merge workflow was retired in 1.6.25: a GITHUB_TOKEN merge
  # gets zero workflow runs on the merge sha, so its deploy is never
  # certified by CD.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Docker base-image bumps stay manual: a Python major is a merits
  # decision, never an auto-merge.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
