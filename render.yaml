# render.yaml — Render Blueprint for the dash-flows documentation site
# (flows.2plot.dev). Deploys run.py (the markdown-driven docs app) as a
# Docker web service. Blueprint spec: https://render.com/docs/blueprint-spec
#
# ---------------------------------------------------------------------------
# BLUEPRINT vs LIVE SERVICE — read this before trusting envVars below.
# Render applies Blueprint `envVars` on Blueprint SYNC only, never on ordinary
# git-push autodeploys. The live service predates this file's current shape,
# so every `sync: false` var — and NETWORK_BULLETIN_URL / APP_BASE_URL if the
# service hasn't been re-synced — must be set directly on the SERVICE in the
# Render dashboard. This bit email.2plot.dev: NETWORK_BULLETIN_URL sat in its
# render.yaml for weeks while the running service never saw it.
#
# OWNER SWEEP, noted here because no test can see it: the live service was
# surveyed (2026-08-16) carrying SATELLITE_APP_ID — a RETIRED name that is
# now read by nothing. The canonical spelling is SATELLITE_APP_KEY (below),
# and run.py additionally claims the identity via os.environ.setdefault, so
# nothing depends on either variable being present. SATELLITE_APP_ID is a
# delete candidate, not a migration.
#
# The shared values for the gate arrive via env GROUPS, which the dashboard
# links to the service: `2plot-network-shared` (the HMAC secret),
# `2plot-satellite-reporting` (cadence + both /var/data paths) and
# `2plot-clerk-satellite` (the whole Clerk block). Group linkage cannot be
# expressed in this file — the boot guards announce if it has not landed.
# ---------------------------------------------------------------------------
#
# Local equivalent (no Render needed):
#   docker build -t dash-flows-docs .
#   docker run --rm -p 8560:8560 -e PORT=8560 dash-flows-docs
#   open http://localhost:8560
services:
  - type: web
    # NOTE: renaming here does NOT rename an already-provisioned service —
    # the live service keeps whatever name it was created with. This value
    # matters for fresh Blueprint syncs only.
    name: dash-flows
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Starter, not free: the free tier sleeps after ~15 min idle (cold-starts
    # the next reader) and cannot mount the disk below — and without that disk
    # every deploy wipes the analytics ledger mid-day. The x402 data window
    # needs both always-on and a ledger that survives restarts.
    plan: starter
    # /healthz returns the network-standard {"ok": true, ...} body; it is
    # excluded from traffic counts at write time (lib/analytics_tracker.py).
    healthCheckPath: /healthz
    autoDeploy: true
    # `release` is written ONLY by CD (.github/workflows/cd.yml, job
    # `deploy`: a fast-forward push of the run's sha after the matrix is
    # green). A push to main is not a deploy. autoDeploy stays on: Render
    # reacting to this branch IS the mechanism (1.6.35, sync item 13).
    # If this service is not Blueprint-managed, this line is documentation
    # only — the dashboard's own Branch field is the actual switch, and
    # only the owner can flip it (see DIVERGENCES.md `deploy:` posture).
    branch: release
    envVars:
      # Flask (WSGI) backend, served by gunicorn. Do NOT set fastapi/quart
      # here: those are ASGI and would need uvicorn instead of gunicorn.
      - key: DASH_BACKEND
        value: flask
      # gunicorn worker processes. 2 is a reasonable default; drop to 1 if the
      # free tier's 512 MB feels tight. The Dockerfile also runs 4 threads per
      # worker for callback concurrency.
      - key: WEB_CONCURRENCY
        value: "2"
      # Canonical public origin — feeds every absolute URL the app emits
      # (canonical tags, sitemap.xml, llms.txt links). APP_BASE_URL is the
      # network-wide name; DASH_FLOWS_BASE_URL is this repo's original
      # spelling and lib/constants.py honours both (APP_BASE_URL wins).
      # The in-code default is already https://flows.2plot.dev, so these are
      # belt-and-braces rather than load-bearing.
      - key: APP_BASE_URL
        value: https://flows.2plot.dev
      # -----------------------------------------------------------------
      # 2plot network wiring
      # -----------------------------------------------------------------
      # The shared HMAC secret every satellite holds — set it ON THE SERVICE
      # in the Render dashboard (same value as on 2plot.ai), never in this
      # file. Without it the app serves fine but reports no traffic.
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # This app's ONE short id on every hub surface (ads, traffic, bulletin):
      # its 2plot network-directory key. Never the PyPI package name.
      - key: SATELLITE_APP_KEY
        value: flows
      - key: AD_APP_ID
        value: flows
      # The hub's announcement feed for the llms.txt viewer header. Opt-in:
      # unset means the viewer renders on built-in tips. REMEMBER: must also
      # be set on the live service directly (see the header note).
      - key: NETWORK_BULLETIN_URL
        value: https://2plot.dev/api/network/bulletin
      # Minimum seconds between rollup POSTs (the contract asks for hourly).
      # 1800 halves what a container eviction can swallow, and the reporter
      # only POSTs when the day's numbers actually changed.
      # 900 is the wave's cadence, delivered fleet-wide via env group
      # `2plot-satellite-reporting`; declared here so the knob is visible.
      # The reporter only POSTs when the day's numbers actually changed, so
      # a shorter interval costs a lease check, not a request.
      - key: SATELLITE_REPORT_INTERVAL_S
        value: "900"

      # Access tiers for the tiered corpus documents (/llms-small.txt,
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default here so every fork SEES the knob: the 402 experiment
      # tightens the full corpus by flipping this to `auth`, per satellite,
      # with no code change. See .env.example for the tier values.
      - key: LLMS_SMALL_TIER
        value: public
      - key: LLMS_FULL_TIER
        value: public

      # The hub takes the LAST report for a given (app, date). On an ephemeral
      # filesystem a mid-day deploy wipes the ledger and the next hourly report
      # overwrites the day's real total with whatever accrued since the
      # restart. The disk below is what stops that.
      - key: TRAFFIC_ANALYTICS_FILE
        value: /var/data/visitor_analytics.json
      # The control board's override store. Shares the disk with the ledger
      # above and for the same reason: without it every deploy silently
      # resets whatever the board was toggled to. lib/page_visibility.py
      # prints a [visibility] WARNING at boot naming exactly which half is
      # missing — the ABSENCE of that line in the deploy log is the check.
      - key: PAGE_VISIBILITY_FILE
        value: /var/data/page_visibility.json

      # -----------------------------------------------------------------
      # The interactive sign-in gate — SHIPPED DARK.
      # -----------------------------------------------------------------
      # `public` is declared EXPLICITLY rather than left unset, and the
      # difference is not cosmetic: run.py passes
      # force=bool(PAGE_DEFAULT_TIER or LLMS_PUBLIC_DEFAULT) to
      # lib.access.configure(), so this value is what wires the verdict
      # plumbing (and the prerender's use of it) live during the dark
      # launch. A host that flips straight from unset to `auth` would be
      # turning the gate on and wiring enforcement in the same deploy, and
      # would prerender gated prose to crawlers in between.
      #
      # THE FLIP, when this host's own pre-flight passes: change this one
      # value to `auth`. Rollback is the same lever back to `public` — no
      # code revert anywhere.
      - key: PAGE_DEFAULT_TIER
        value: public
      # LLMS_PUBLIC_DEFAULT stays UNSET network-wide until phase 4: machine
      # surfaces (/llms.txt, /<page>/llms.txt, the crawler document) remain
      # public through the data window BY DECISION, even on pages the
      # interactive gate closes. Setting it here would quietly end that.
      #
      # Clerk satellite auth. Every value below arrives from the shared env
      # GROUP `2plot-clerk-satellite`, which is why none are declared with
      # values here — declaring them would fight the group on the next
      # Blueprint sync. Listed as `sync: false` so the knobs are visible in
      # this file and the dashboard is the single source:
      #   CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, CLERK_SIGN_IN_URL,
      #   CLERK_IS_SATELLITE, CLERK_SATELLITE_DOMAIN,
      #   CLERK_SATELLITE_SIGN_IN_REDIRECT  (= https://2plot.ai/onboarding;
      #     unset strands authenticated users, a truthy non-URL gives a
      #     404ing Sign In button — lib/auth.py boot-guards both, and the
      #     absence of its [auth] WARNING lines is the acceptance check)
      #   SESSION_SECRET  (per-service and UNIQUE — never shared)
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SIGN_IN_URL
        sync: false
      - key: CLERK_IS_SATELLITE
        sync: false
      - key: CLERK_SATELLITE_DOMAIN
        sync: false
      - key: CLERK_SATELLITE_SIGN_IN_REDIRECT
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Who may reach /admin/control-board once Clerk is on. Comma-separated
      # addresses; fails CLOSED when unset.
      - key: ADMIN_EMAILS
        sync: false

    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1
